name: Auto Update Configs

# Скрипт сработает сам, когда ты изменишь файл SOURCE.txt
on:
  push:
    paths:
      - 'SOURCE.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Run Python Replace Script
        run: |
          python -c "
          import os

          # ИМЯ ФАЙЛА, ОТКУДА БРАТЬ НОВЫЙ ТЕКСТ
          SOURCE_FILE = 'SOURCE.txt'
          START_LINE = 7
          # КАКИЕ ФАЙЛЫ ОБНОВЛЯТЬ (можно добавить свои расширения)
          EXTENSIONS = ['.txt', '.md', '.html', '.conf']
          
          # Файлы, которые нельзя трогать
          SKIP_FILES = ['auto_update.yml', SOURCE_FILE, 'README.md']

          if not os.path.exists(SOURCE_FILE):
              print(f'Файл {SOURCE_FILE} не найден! Создайте его.')
              exit(1)

          # Читаем твои VLESS конфиги
          with open(SOURCE_FILE, 'r', encoding='utf-8') as f:
              new_text_content = f.read()

          print('Начинаю обновление...')
          count = 0

          for root, dirs, files in os.walk('.'):
              if '.git' in dirs: dirs.remove('.git')
              if '.github' in dirs: dirs.remove('.github')

              for file in files:
                  if file in SKIP_FILES: continue
                  if not any(file.endswith(ext) for ext in EXTENSIONS): continue

                  path = os.path.join(root, file)
                  try:
                      with open(path, 'r', encoding='utf-8') as f:
                          lines = f.readlines()
                      
                      # Оставляем первые 6 строк
                      kept_lines = lines[:START_LINE-1]

                      # Если последняя строка без переноса, добавляем его
                      if kept_lines and not kept_lines[-1].endswith('\n'):
                          kept_lines[-1] += '\n'
                      
                      # Если после 6 строк пусто, добавляем разделитель (опционально)
                      if not kept_lines:
                          kept_lines.append('\n')

                      # Добавляем конфиги
                      final_content = ''.join(kept_lines) + new_text_content
                      
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(final_content)
                          
                      count += 1
                  except Exception as e:
                      print(f'Ошибка {path}: {e}')

          print(f'Готово! Обновлено файлов: {count}')
          "

      - name: Commit changes
        run: |
          git config --global user.name "Config Bot"
          git config --global user.email "bot@noreply.github.com"
          git add .
          # Если изменений нет, не вылетать с ошибкой
          git commit -m "Auto-update configs from SOURCE.txt" || exit 0
          git push

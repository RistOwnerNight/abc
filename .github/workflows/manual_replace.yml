name: Force Update Configs

on:
  push:
    paths:
      - 'SOURCE.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-all-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Run Aggressive Script
        run: |
          python -c "
          import os

          # === НАСТРОЙКИ ===
          SOURCE_FILE = 'SOURCE.txt'
          START_LINE = 7
          # Файлы, которые НЕЛЬЗЯ трогать
          SKIP_FILES = ['SOURCE.txt', 'README.md', 'LICENSE']
          # Расширения, которые НЕЛЬЗЯ трогать (картинки, сам скрипт)
          SKIP_EXTS = ['.yml', '.yaml', '.png', '.jpg', '.jpeg', '.git']
          # =================

          if not os.path.exists(SOURCE_FILE):
              print(f'ОШИБКА: Файл {SOURCE_FILE} не найден!')
              exit(1)

          with open(SOURCE_FILE, 'r', encoding='utf-8') as f:
              new_text = f.read()

          print(f'Текст взят из {SOURCE_FILE}.')
          
          count = 0
          for root, dirs, files in os.walk('.'):
              if '.git' in dirs: dirs.remove('.git')
              if '.github' in dirs: dirs.remove('.github')

              for file in files:
                  if file in SKIP_FILES: continue
                  # Если файл имеет запрещенное расширение - пропускаем
                  if any(file.endswith(ext) for ext in SKIP_EXTS): continue

                  full_path = os.path.join(root, file)
                  try:
                      with open(full_path, 'r', encoding='utf-8') as f:
                          lines = f.readlines()
                      
                      # Оставляем строки 1-6
                      kept = lines[:START_LINE-1]
                      
                      # Если файл пустой или короткий, добавляем перенос
                      if not kept: kept = ['\n']
                      if kept and not kept[-1].endswith('\n'): kept[-1] += '\n'

                      # Записываем
                      with open(full_path, 'w', encoding='utf-8') as f:
                          f.writelines(kept)
                          f.write(new_text)
                      
                      print(f'ОБНОВЛЕН: {full_path}')
                      count += 1
                  except Exception as e:
                      print(f'Ошибка {full_path}: {e}')

          print(f'ИТОГ: Обновлено файлов: {count}')
          "

      - name: Commit & Push
        run: |
          git config --global user.name "Bot"
          git config --global user.email "bot@noreply.github.com"
          git add .
          git commit -m "Update configs" || echo "Changes not found"
          git push
